<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Checker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Bookmark Checker</h1>
      <p class="subtitle">Validate links & remove broken bookmarks</p>
    </header>

    <div class="controls">
      <button id="startScanBtn" class="btn btn-primary">Start Scanning</button>
      <button id="cancelScanBtn" class="btn btn-secondary" disabled>Cancel</button>
    </div>

    <div class="status-card" id="statusCard">
      <div class="status-header">
        <span id="statusLabel">Status: Ready</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <p id="statusDetails" class="status-details">Click 'Start Scanning' to check all bookmarks.</p>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <span class="stat-number" id="totalCount">0</span>
        <span class="stat-title">Total</span>
      </div>
      <div class="stat-box">
        <span class="stat-number success" id="validCount">0</span>
        <span class="stat-title">Valid</span>
      </div>
      <div class="stat-box">
        <span class="stat-number warning" id="duplicateCount">0</span>
        <span class="stat-title">Duplicates</span>
      </div>
      <div class="stat-box">
        <span class="stat-number danger" id="brokenCount">0</span>
        <span class="stat-title">Broken</span>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="all">All Bookmarks</button>
      <button class="tab-btn" data-tab="broken">Broken Links</button>
      <button class="tab-btn" data-tab="duplicates">Duplicates</button>
    </div>

    <div class="results-container">
      <ul id="resultsList" class="results-list">
        <li class="empty-state">No scan results yet. Start a scan to list bookmarks.</li>
      </ul>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
